<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KELEX · Web UI</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="url(#paint0_linear)"/>
          <defs>
            <linearGradient id="paint0_linear" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00f0ff"/>
              <stop offset="1" stop-color="#7000ff"/>
            </linearGradient>
          </defs>
        </svg>
        KELEX
      </div>

      <div class="status-badge">
        <div class="status-dot"></div>
        Engine Online
      </div>

      <div class="nav-stats">
        <div class="stat-item">
          <div class="stat-label">Active Downloads</div>
          <div class="stat-value highlight" id="stat-active">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="stat-completed" style="color: var(--success);">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Total Speed</div>
          <div class="stat-value" id="stat-speed">0 KB/s</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Free Space</div>
          <div class="stat-value" id="stat-storage" style="color: var(--warning);">-- GB</div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <div class="top-bar">
        <div class="page-title">Dashboard</div>
      </div>

      <!-- Add Download Form -->
      <div class="add-download-card">
        <div class="input-group">
          <input type="text" class="url-input" id="url-input" placeholder="Paste HTTP URL, YouTube Video, or Magnet Link..." autocomplete="off" spellcheck="false">
          <button class="btn-primary" id="btn-add-url">Start Download</button>
        </div>
      </div>

      <!-- Downloads List -->
      <div class="downloads-container" id="downloads-container">
        <!-- Injected via app.js -->
        <div class="empty-state animate-slide-up">
          <div class="empty-icon">⚡</div>
          <h3>Loading Engine State...</h3>
        </div>
      </div>

    </main>
  </div>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
